# ══════════════════════════════════════════════════════════════════════════════
# Hyprland Configuration — mohireza
# Docs: https://wiki.hypr.land/Configuring/
# ══════════════════════════════════════════════════════════════════════════════


# ─── IMPORTS ──────────────────────────────────────────────────────────────────

source = ~/.config/hypr/noctalia.conf


# ─── MONITORS ─────────────────────────────────────────────────────────────────

monitor = eDP-2,    2560x1440@165.00Hz, 0x0,   1
monitor = HDMI-A-1, 1920x1080@59.94,   2560x0, 1
monitor = ,preferred,auto,1


# ─── VARIABLES ────────────────────────────────────────────────────────────────

$mainMod     = SUPER
$terminal    = ghostty
$fileManager = dolphin
$browser     = zen-browser
$menu        = noctalia msg panel-toggle launcher


# ─── AUTOSTART ────────────────────────────────────────────────────────────────

exec-once = nm-applet & powerkit
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = noctalia
exec-once = pypr
exec-once = easyeffects
exec-once = /home/mohireza/Documents/toggle_cpu_boost.sh
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = /usr/bin/kdeconnectd
exec-once = kdeconnect-indicator


# ─── ENVIRONMENT ──────────────────────────────────────────────────────────────

# Cursor
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Qt theming
env = QT_QPA_PLATFORMTHEME,kde

# GPU — AMD 680M = card2 (compositor), NVIDIA 3070 Ti = card1 (prime-run offload)
# AQ_DRM_DEVICES: restrict Hyprland to AMD iGPU only (card2)
env = AQ_DRM_DEVICES,/dev/dri/card2
env = LIBVA_DRIVER_NAME,radeonsi

# Prevent Hyprland & clients from loading NVIDIA EGL/GLX — keeps dGPU suspended
# Point EGL to AMD Mesa only so no process in the compositor tree opens /dev/nvidia*
env = __EGL_VENDOR_LIBRARY_FILENAMES,/usr/share/glvnd/egl_vendor.d/50_mesa.json
env = __GLX_VENDOR_LIBRARY_NAME,mesa

# Run apps on NVIDIA: prime-run <app>
# (unset __EGL_VENDOR_LIBRARY_FILENAMES and set __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia)


# ─── LOOK AND FEEL ────────────────────────────────────────────────────────────

cursor {
    no_hardware_cursors = false
}

general {
    gaps_in  = 2
    gaps_out = 5

    border_size         = 2
    col.active_border   = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing    = false
    layout           = dwindle
}

decoration {
    rounding       = 8
    rounding_power = 2

    active_opacity   = 0.95
    inactive_opacity = 0.9

    shadow {
        enabled      = true
        range        = 4
        render_power = 3
        color        = rgba(1a1a1aee)
    }

    blur {
        enabled  = true
        size     = 3
        passes   = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    #             NAME              X0     Y0     X1    Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    #            NAME                ON  SPEED  CURVE           [STYLE]
    animation = global,              1,  10,    default
    animation = border,              1,  5.39,  easeOutQuint
    animation = windows,             1,  4.79,  easeOutQuint
    animation = windowsIn,           1,  4.1,   easeOutQuint,   popin 87%
    animation = windowsOut,          1,  1.49,  linear,         popin 87%
    animation = fadeIn,              1,  1.73,  almostLinear
    animation = fadeOut,             1,  1.46,  almostLinear
    animation = fade,                1,  3.03,  quick
    animation = layers,              1,  3.81,  easeOutQuint
    animation = layersIn,            1,  4,     easeOutQuint,   fade
    animation = layersOut,           1,  1.5,   linear,         fade
    animation = fadeLayersIn,        1,  1.79,  almostLinear
    animation = fadeLayersOut,       1,  1.39,  almostLinear
    animation = workspaces,          1,  1.94,  almostLinear,   fade
    animation = workspacesIn,        1,  1.21,  almostLinear,   fade
    animation = workspacesOut,       1,  1.94,  almostLinear,   fade
    animation = zoomFactor,          1,  7,     quick
    animation = specialWorkspace,    1,  3.5,   easeInOutCubic, slidevert
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo   = true
}


# ─── INPUT ────────────────────────────────────────────────────────────────────

input {
    kb_layout  = us,ir
    kb_options = grp:alt_shift_toggle

    repeat_delay = 650
    repeat_rate  = 20
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace


# ─── KEYBINDINGS ──────────────────────────────────────────────────────────────

# — Apps ———————————————————————————————————————————————————————————————————————
bind = $mainMod,       Q,     exec, $terminal
bind = $mainMod,       F,     exec, $browser
bind = $mainMod,       E,     exec, $fileManager
bind = $mainMod,       R,     exec, $menu
bind = $mainMod,       T,     exec, telegram-desktop
bind = $mainMod,       A,     exec, env __GLX_VENDOR_LIBRARY_NAME=mesa spotify-launcher
bind = $mainMod,       Z,     exec, code
bind = $mainMod,       Y,     exec, $terminal -e nvim ~/.config/hypr/hyprland.conf

# — Noctalia IPC ———————————————————————————————————————————————————————————————
bind = $mainMod,       V,     exec, noctalia msg panel-toggle clipboard
bind = $mainMod,       W,     exec, noctalia msg wallpaper-random

# — Pyprland ———————————————————————————————————————————————————————————————————
bind = $mainMod,       TAB,   exec, pypr toggle term
bind = $mainMod,       grave, exec, pypr toggle v2rayn
bind = $mainMod,       U,     exec, ~/.config/hypr/floating-terminal.sh
bind = $mainMod,       X,     exec, pypr layout_center toggle
bind = $mainMod SHIFT, X,     exec, pypr layout_center next
bind = $mainMod CTRL,  X,     exec, pypr layout_center prev
bind = $mainMod,       SPACE, exec, pypr toggle zen

# — Screenshots ————————————————————————————————————————————————————————————————
bind = ,               PRINT, exec, hyprshot -m region
bind = $mainMod,       PRINT, exec, hyprshot -m output

# — System ————————————————————————————————————————————————————————————————————
bind = $mainMod,       L,     exec, hyprlock
bind = $mainMod,       K,     exec, rofimoji --action copy && wl-paste
bind = $mainMod SHIFT, C,     exec, hyprpicker -a
bind = $mainMod,       F1,    exec, ~/.config/hypr/gamemode.sh
bind = $mainMod,       F2,    exec, ~/.config/hypr/refresh_rate.sh
bind = $mainMod,       F3,    exec, /home/mohireza/Documents/toggle_cpu_boost.sh

# — Window management ——————————————————————————————————————————————————————————
bind = $mainMod,       C,     killactive
bind = $mainMod,       M,     exit
bind = $mainMod,       O,     togglefloating
bind = $mainMod,       N,     focusurgentorlast
bind = $mainMod,       B,     pin
bind = $mainMod,       P,     pseudo
bind = $mainMod,       J,     layoutmsg,  togglesplit
bind = $mainMod SHIFT, J,     layoutmsg,  swapsplit
bind = $mainMod SHIFT, F,     fullscreen, 0
bind = $mainMod CTRL,  F,     fullscreen, 1
bind = $mainMod SHIFT, O,     setprop,    active opaque toggle

# — Groups (tabbing) ———————————————————————————————————————————————————————————
bind = $mainMod,       G,     togglegroup
bind = $mainMod SHIFT, G,     moveintogroup,    r
bind = $mainMod SHIFT, TAB,   changegroupactive

# — Focus ——————————————————————————————————————————————————————————————————————
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# — Move windows ———————————————————————————————————————————————————————————————
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# — Switch workspaces ——————————————————————————————————————————————————————————
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# — Move window to workspace ———————————————————————————————————————————————————
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# — Navigate / move to adjacent workspaces ————————————————————————————————————
bind = $mainMod CTRL, left,  workspace,       e-1
bind = $mainMod CTRL, right, workspace,       e+1
bind = $mainMod ALT,  left,  movetoworkspace, e-1
bind = $mainMod ALT,  right, movetoworkspace, e+1

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# — Scratchpad —————————————————————————————————————————————————————————————————
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace,        special:magic

# — Resize submap (SUPER+SHIFT+R → arrows resize, ENTER/ESC exits) —————————————
bind = $mainMod SHIFT, R, submap, resize
submap = resize
bind = ,      right, resizeactive,  40 0
bind = ,      left,  resizeactive, -40 0
bind = ,      up,    resizeactive,  0 -40
bind = ,      down,  resizeactive,  0  40
bind = SHIFT, right, resizeactive,  10 0
bind = SHIFT, left,  resizeactive, -10 0
bind = SHIFT, up,    resizeactive,  0 -10
bind = SHIFT, down,  resizeactive,  0  10
bind = ,      Return, submap, reset
bind = ,      Escape, submap, reset
submap = reset

# — Mouse drag ——————————————————————————————————————————————————————————————————
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# — Media & hardware keys ——————————————————————————————————————————————————————
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPrev,  exec, playerctl previous

bindl  = , XF86Launch4, exec, ~/.config/hypr/performance_mode.sh notify


# ─── WORKSPACES ───────────────────────────────────────────────────────────────

workspace = 1,  persistent:true
workspace = 2,  persistent:true
workspace = 3,  persistent:true
workspace = 4,  persistent:true
workspace = 5,  persistent:true


# ─── WINDOW RULES ─────────────────────────────────────────────────────────────

# Scratchpads — no border
windowrule = border_size 0, match:class ^(com\.scratchpad\.term)$
windowrule = border_size 0, match:class ^(v2rayN)$

# Noctalia windows — float and center
windowrule = float 1,  match:class ^(noctalia-.*)$
windowrule = center 1, match:class ^(noctalia-.*)$


# ─── LAYER RULES ──────────────────────────────────────────────────────────────

layerrule {
    name            = noctalia
    match:namespace = ^(noctalia-(bar-.+|notification|dock|panel|attached-panel|osd))$
    blur            = true
    blur_popups     = true
    no_anim         = true
    ignore_alpha    = 0.5
}
